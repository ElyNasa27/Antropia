name: Correos de coincidencias por cursos

# Empareja Participantes por cursos, registra los pares en «Matches por cursos [PRUEBA]»
# y envía UNA vez el correo de cada persona (plantilla de Notion). Ver match_cursos.py.
#
# Una sola ejecución a la vez (concurrency): es lo que impide envíos dobles, porque el
# registro de envíos vive en Notion y Notion no tiene escrituras atómicas. No ejecutes el
# envío desde ningún otro sitio (las credenciales de Gmail solo deben estar aquí).
#
# Para activarlo: Settings → Secrets and variables → Actions → Variables →
# ANTROPIA_ENVIAR_CORREOS_CURSOS = si. Con cualquier otro valor la ejecución programada no
# corre y los modos «enviar» y «reenviar» se detienen antes de tocar nada.
on:
  schedule:
    - cron: "15 * * * *"          # cada hora, al minuto 15
  workflow_dispatch:
    inputs:
      modo:
        description: "simulacion = solo lee y cuenta; enviar = escribe y envía; reenviar = un correo «Por revisar»"
        type: choice
        options: [simulacion, enviar, reenviar]
        default: simulacion
      id_correo:
        description: "Solo para reenviar: el «Id correo» COMPLETO Y EXACTO del último intento"
        type: string
        default: ""

permissions:
  contents: read
  actions: read                   # para comprobar si una ejecución anterior terminó

concurrency:
  group: correos-cursos
  cancel-in-progress: false

jobs:
  correos:
    if: github.event_name == 'workflow_dispatch' || vars.ANTROPIA_ENVIAR_CORREOS_CURSOS == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas
        run: python -m unittest discover -s tests -t .
      - name: Ejecutar
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTROPIA_SMTP_USUARIO: ${{ secrets.ANTROPIA_SMTP_USUARIO }}
          ANTROPIA_SMTP_CLAVE: ${{ secrets.ANTROPIA_SMTP_CLAVE }}
          ANTROPIA_ESCRIBIR_MATCHES_CURSOS: ${{ vars.ANTROPIA_ENVIAR_CORREOS_CURSOS }}
          ANTROPIA_ENVIAR_CORREOS_CURSOS: ${{ vars.ANTROPIA_ENVIAR_CORREOS_CURSOS }}
          ANTROPIA_CURSOS_INSTRUCCIONES: ${{ vars.ANTROPIA_CURSOS_INSTRUCCIONES }}
          GITHUB_TOKEN: ${{ github.token }}
          MODO: ${{ github.event_name == 'workflow_dispatch' && inputs.modo || 'enviar' }}
          ID_CORREO: ${{ inputs.id_correo }}
        run: |
          # --solo-filas-de-la-base: solo las filas que una persona puso en la base (decisión
          # del 2026-11-23 para empezar). Quitarlo para que el agente añada también sus matches.
          case "$MODO" in
            simulacion) python match_cursos.py --solo-filas-de-la-base --ensayo-escritura --simular-correos --solo-recuentos ;;
            enviar)     python match_cursos.py --solo-filas-de-la-base --escribir --enviar --solo-recuentos ;;
            reenviar)   python match_cursos.py --solo-filas-de-la-base --escribir --reenviar "$ID_CORREO" --solo-recuentos ;;
            *)          echo "Modo desconocido"; exit 2 ;;
          esac
